<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#AA432D">
  <meta name="description" content="เข้าสู่ระบบ Jimmy SuperMarket POS">
  <title>เข้าสู่ระบบ | Jimmy SuperMarket</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
  <div class="login-page">
    <main class="login-wrap">
      <section class="login-card" aria-labelledby="loginTitle">
        <div class="login-brand">
          <div class="login-logo" aria-hidden="true"><span class="shop-icon">🏪</span><span class="shop-badge">24</span></div>
          <h1 id="loginTitle">ร้านของฉัน</h1>
          <p class="shop-name">Jimmy SuperMarket</p>
          <p class="login-subtitle">ระบบขายและจัดการสต๊อกสำหรับร้านของคุณ</p>
          <div class="login-green-line"></div>
        </div>

        <form id="loginForm" novalidate>
          <div class="login-field">
            <label for="email"><span class="label-icon" aria-hidden="true">✉</span>อีเมล</label>
            <input id="email" name="email" type="email"  value="jimmyyoyo2528@gmail.com" placeholder="example@email.com" autocomplete="username" inputmode="email" required>
          </div>
          <div class="login-field">
            <label for="password"><span class="label-icon" aria-hidden="true">●</span>รหัสผ่าน</label>
            <div class="password-wrapper">
              <input id="password" name="password" type="password" value="jimmy@" placeholder="กรอกรหัสผ่าน" autocomplete="current-password" required>
              <button id="togglePassword" class="password-toggle" type="button" aria-label="แสดงรหัสผ่าน">👁</button>
            </div>
          </div>
          <div class="login-options">
            <button type="button" id="forgotPassword" class="forgot-password">ลืมรหัสผ่าน?</button>
          </div>
          <button id="loginButton" class="login-button" type="submit">
            <span id="loginSpinner" class="login-spinner" aria-hidden="true"></span>
            <span id="loginButtonIcon" aria-hidden="true">↪</span>
            <span id="loginButtonText">เข้าสู่ระบบ</span>
          </button>
          <div id="loginMessage" class="login-message" aria-live="polite"></div>
        </form>

        <div class="login-divider" aria-hidden="true"><span></span><p>พร้อมเริ่มขาย</p><span></span></div>
        <div class="login-info">
          <div class="login-info-icon" aria-hidden="true">🌾</div>
          <div class="login-info-content"><strong>ระบบร้านค้าครบในที่เดียว</strong><p>ขายง่าย • สต๊อกชัด • รายงานครบ</p></div>
        </div>
        <div class="login-footer">Jimmy POS <span>•</span> Version 1.1</div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" aria-live="polite"></div>
  <script type="module" src="js/login.js"></script>
</body>
</html>
