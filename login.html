<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#08a957">
    <title>เข้าสู่ระบบ | ร้านของฉัน</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <main class="login-wrap">
            <section class="login-card card">
                <div class="brand">
                    <div class="logo">🏪</div>
                    <h1>ร้านของฉัน</h1>
                    <p>ระบบขายสินค้าและจัดการสต๊อก</p>
                </div>
                <form id="loginForm">
                    <div class="field"><label>อีเมล</label><input id="email" type="email" value="jimmyyoyo2528@gmail.com"
                            autocomplete="username"></div>
                    <div class="field"><label>รหัสผ่าน</label><input id="password" type="password" value="jimmy@"
                            autocomplete="current-password"></div><button
                        class="btn btn-primary btn-block">เข้าสู่ระบบ</button>
                </form>ß
            </section>
        </main>
    </div>
    <div class="toast" aria-live="polite"></div>
    <script
        type="module">import { login } from './js/auth.js'; document.querySelector('#loginForm').onsubmit = e => { e.preventDefault(); login(email.value, password.value) }</script>
</body>

</html>
