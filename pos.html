<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08a957"><title>ขายสินค้า | ร้านของฉัน</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><header class="topbar"><button class="icon-btn">☰</button><h1>ขายสินค้า</h1><a class="icon-btn" href="sales.html" style="display:grid;place-items:center">🧾</a></header><main class="page"><button id="scanBtn" class="scan-hero"><span class="big">▥</span><strong>สแกนบาร์โค้ด</strong><small>แตะเพื่อเปิดกล้อง</small></button><form id="manualForm" class="search"><span>⌕</span><input id="manualCode" inputmode="numeric" placeholder="ยิงหรือกรอกบาร์โค้ด แล้วกด Enter"></form><div class="search"><span>⌕</span><input id="search" placeholder="ค้นหาสินค้า"></div><div class="section-title"><h2>สินค้า</h2><a href="products.html">ดูทั้งหมด</a></div><div id="productGrid" class="product-grid"></div><div class="section-title"><h2>ตะกร้าสินค้า</h2><span><b id="pieceCount">0</b> ชิ้น</span></div><div id="cartList" class="list"></div><section class="summary card"><div class="summary-line total"><span>ยอดสุทธิ</span><span id="total">฿0</span></div><button id="checkout" class="btn btn-primary btn-block">ชำระเงิน</button></section></main><div id="scannerModal" class="modal"><div class="sheet"><div class="section-title"><h2>สแกนบาร์โค้ด</h2><button id="closeScanner" class="icon-btn">×</button></div><div class="scanner-box"><video id="scannerVideo" playsinline></video><div class="scan-frame"></div></div><p class="muted" style="text-align:center">วางบาร์โค้ดให้อยู่ในกรอบ</p></div></div><div id="paymentModal" class="modal"><div class="sheet"><div class="section-title"><h2>ชำระเงิน</h2><button id="closePayment" class="icon-btn">×</button></div><div style="text-align:center"><span class="muted">ยอดสุทธิ</span><h1 id="payTotal" style="color:var(--green);font-size:38px"></h1></div><div class="two-col"><label class="card" style="padding:15px"><input type="radio" name="pay" value="cash" checked> 💵 เงินสด</label><label class="card" style="padding:15px"><input type="radio" name="pay" value="transfer"> ▦ โอน/QR</label></div><div class="field" style="margin-top:15px"><label>รับเงิน</label><input id="received" type="number" min="0" value="100"></div><div class="two-col"><button class="btn btn-secondary" data-cash="100">฿100</button><button class="btn btn-secondary" data-cash="500">฿500</button></div><div class="summary-line total"><span>เงินทอน</span><span id="change" class="money-positive"></span></div><button id="confirmPay" class="btn btn-primary btn-block">ยืนยันการชำระเงิน</button></div></div><div id="nav"></div></div><div class="toast" aria-live="polite"></div><script type="module" src="js/pos.js"></script></body></html>
