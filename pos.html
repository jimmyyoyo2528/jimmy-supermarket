<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

    <meta name="theme-color" content="#08a957">

    <title>ขายสินค้า | ร้านของฉัน</title>

    <link rel="stylesheet" href="css/style.css">
</head>


<body class="pos-body">

    <div class="app pos-app">


        <!-- =====================================================
         HEADER
    ====================================================== -->

        <header class="pos-topbar">

            <button class="pos-icon-btn" id="menuBtn" type="button" aria-label="เปิดเมนู">
                ☰
            </button>


            <div class="pos-title">

                <small>
                    Jimmy SuperMarket
                </small>

                <h1>
                    ขายสินค้า
                </h1>

            </div>


            <!-- <a class="pos-icon-btn" href="sales.html" aria-label="รายการขาย">
                🧾
            </a> -->

        </header>



        <!-- =====================================================
         MAIN
    ====================================================== -->

        <main class="pos-page">


            <!-- =================================================
             SCANNER
        ================================================== -->

            <button id="scanBtn" class="pos-scan-card" type="button">

                <div class="pos-scan-icon">
                    ▥
                </div>

                <div class="pos-scan-text">

                    <strong>
                        สแกนบาร์โค้ด
                    </strong>

                    <small>
                        แตะเพื่อเปิดกล้อง
                    </small>

                </div>


                <span class="pos-scan-arrow">
                    ›
                </span>

            </button>



            <!-- =================================================
             BARCODE INPUT
        ================================================== -->

            <form id="manualForm" class="pos-search">

                <span class="pos-search-icon">
                    ⌕
                </span>


                <input id="manualCode" type="text" inputmode="numeric" placeholder="ยิงหรือกรอกบาร์โค้ด แล้วกด Enter"
                    autocomplete="off">

            </form>



            <!-- =================================================
             PRODUCT SEARCH
        ================================================== -->

            <div class="pos-search">

                <span class="pos-search-icon">
                    ⌕
                </span>


                <input id="search" type="search" placeholder="ค้นหาสินค้า" autocomplete="off">

            </div>



            <!-- =================================================
             PRODUCTS
        ================================================== -->

            <section class="pos-section">

                <div class="pos-section-title">

                    <div>

                        <small>
                            เลือกสินค้า
                        </small>

                        <h2>
                            สินค้า
                        </h2>

                    </div>


                    <a href="products.html">
                        ดูทั้งหมด
                    </a>

                </div>


                <div id="productGrid" class="product-grid"></div>

            </section>



            <!-- =================================================
             CART
        ================================================== -->

            <section class="pos-section pos-cart-section">

                <div class="pos-section-title">

                    <div>

                        <small>
                            รายการปัจจุบัน
                        </small>

                        <h2>
                            ตะกร้าสินค้า
                        </h2>

                    </div>


                    <span class="pos-cart-count">

                        <b id="pieceCount">
                            0
                        </b>

                        ชิ้น

                    </span>

                </div>


                <div id="cartList" class="list pos-cart-list"></div>

            </section>



            <!-- =================================================
             SUMMARY
        ================================================== -->

            <section class="pos-summary">

                <div class="pos-summary-total">

                    <div>

                        <small>
                            ยอดสุทธิ
                        </small>

                        <strong id="total">
                            ฿0
                        </strong>

                    </div>


                    <span class="pos-summary-icon">
                        🛒
                    </span>

                </div>


                <button id="checkout" class="pos-checkout-btn" type="button">

                    <span>
                        ชำระเงิน
                    </span>

                    <strong>
                        →
                    </strong>

                </button>

            </section>


        </main>



        <!-- =====================================================
         SCANNER MODAL
    ====================================================== -->

        <div id="scannerModal" class="modal">

            <div class="sheet">

                <div class="section-title">

                    <h2>
                        สแกน QR / บาร์โค้ด
                    </h2>


                    <button id="closeScanner" class="icon-btn" type="button">
                        ×
                    </button>

                </div>


                <div class="scanner-box">

                    <video id="scannerVideo" playsinline></video>

                    <div class="scan-frame"></div>

                </div>

            </div>

        </div>



        <!-- =====================================================
         PAYMENT MODAL
    ====================================================== -->

        <div id="paymentModal" class="modal">

            <div class="sheet payment-sheet">


                <!-- HEADER -->

                <div class="section-title">

                    <h2>
                        ชำระเงิน
                    </h2>


                    <button id="closePayment" class="icon-btn" type="button">
                        ×
                    </button>

                </div>



                <!-- TOTAL -->

                <div class="payment-total">

                    <span class="muted">
                        ยอดสุทธิ
                    </span>

                    <h1 id="payTotal"></h1>

                </div>



                <!-- PAYMENT METHOD -->

                <div class="payment-methods">

                    <label class="payment-method">

                        <input type="radio" name="pay" value="cash" checked>

                        <span class="payment-method-icon">
                            💵
                        </span>

                        <strong>
                            เงินสด
                        </strong>

                    </label>



                    <label class="payment-method">

                        <input type="radio" name="pay" value="transfer">

                        <span class="payment-method-icon">
                            ▦
                        </span>

                        <strong>
                            โอน / QR
                        </strong>

                    </label>

                </div>



                <!-- CASH -->

                <!-- CASH -->

                <div id="cashPanel">

                    <div class="field payment-field">

                        <label>
                            รับเงิน
                        </label>

                        <input id="received" type="number" min="0" inputmode="decimal" placeholder="0">

                    </div>


                    <!-- ระบบสร้างจำนวนเงินให้อัตโนมัติ -->
                    <div id="cashShortcuts" class="cash-shortcuts"></div>


                    <div class="payment-change">

                        <span>
                            เงินทอน
                        </span>

                        <strong id="change" class="money-positive"></strong>

                    </div>

                </div>



                <!-- QR -->

                <div id="qrPanel" hidden class="payment-qr-panel">

                    <div id="paymentQr" class="payment-qr">
                        ยังไม่ได้ตั้งค่า QR
                    </div>


                    <b id="qrAccount"></b>


                    <span id="qrBank" class="muted"></span>


                    <p class="muted">
                        ให้ลูกค้าสแกนและตรวจสอบยอดก่อนยืนยัน
                    </p>

                </div>



                <!-- CONFIRM -->

                <button id="confirmPay" class="btn btn-primary btn-block pos-confirm-payment" type="button">
                    ยืนยันการชำระเงิน
                </button>


            </div>

        </div>



        <!-- =====================================================
         NAVIGATION
    ====================================================== -->

        <div id="nav"></div>


    </div>



    <div class="toast"></div>


    <script type="module" src="js/pos.js"></script>


</body>

</html>
