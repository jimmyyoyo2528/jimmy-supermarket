<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#AA432D">
  <title>ขายสินค้า | Jimmy SuperMarket</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/pos.css">
</head>
<body class="pos-body">
  <div class="app pos-app">
    <header class="pos-topbar">
      <a class="pos-icon-btn" id="menuBtn" href="settings.html" aria-label="ไปหน้าตั้งค่า">☰</a>
      <div class="pos-title"><small>Jimmy SuperMarket</small><h1>ขายสินค้า</h1></div>
    </header>

    <main class="pos-page">
      <button id="scanBtn" class="pos-scan-card" type="button">
        <span class="pos-scan-icon" aria-hidden="true">▥</span>
        <span class="pos-scan-text"><strong>สแกนบาร์โค้ด</strong><small>แตะเพื่อเปิดกล้อง</small></span>
        <span class="pos-scan-arrow" aria-hidden="true">›</span>
      </button>

      <form id="manualForm" class="pos-search">
        <span class="pos-search-icon" aria-hidden="true">⌕</span>
        <input id="manualCode" type="text" inputmode="numeric" placeholder="ยิงหรือกรอกบาร์โค้ด แล้วกด Enter" autocomplete="off" aria-label="กรอกบาร์โค้ด">
      </form>
      <div class="pos-search">
        <span class="pos-search-icon" aria-hidden="true">⌕</span>
        <input id="search" type="search" placeholder="ค้นหาสินค้า" autocomplete="off" aria-label="ค้นหาสินค้า">
      </div>

      <section class="pos-section" aria-labelledby="productTitle">
        <div class="pos-section-title"><div><small>เลือกสินค้า</small><h2 id="productTitle">สินค้า</h2></div><a href="products.html">ดูทั้งหมด</a></div>
        <div id="productGrid" class="product-grid" aria-live="polite"></div>
      </section>

      <section class="pos-section pos-cart-section" aria-labelledby="cartTitle">
        <div class="pos-section-title"><div><small>รายการปัจจุบัน</small><h2 id="cartTitle">ตะกร้าสินค้า</h2></div><span class="pos-cart-count"><b id="pieceCount">0</b> ชิ้น</span></div>
        <div id="cartList" class="list pos-cart-list" aria-live="polite"></div>
      </section>

      <section class="pos-summary" aria-label="สรุปยอดชำระ">
        <div class="pos-summary-total"><div><small>ยอดสุทธิ</small><strong id="total">฿0</strong></div><span class="pos-summary-icon" aria-hidden="true">🛒</span></div>
        <button id="checkout" class="pos-checkout-btn" type="button"><span>ชำระเงิน</span><strong aria-hidden="true">→</strong></button>
      </section>
    </main>

    <div id="scannerModal" class="modal" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="scannerTitle">
      <div class="sheet">
        <div class="section-title"><h2 id="scannerTitle">สแกน QR / บาร์โค้ด</h2><button id="closeScanner" class="icon-btn" type="button" aria-label="ปิดเครื่องสแกน">×</button></div>
        <div class="scanner-box"><video id="scannerVideo" playsinline></video><div class="scan-frame"></div></div>
      </div>
    </div>

    <div id="paymentModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="paymentTitle">
      <div class="sheet payment-sheet">
        <div class="section-title"><h2 id="paymentTitle">ชำระเงิน</h2><button id="closePayment" class="icon-btn" type="button" aria-label="ปิดหน้าชำระเงิน">×</button></div>
        <div class="payment-total"><span class="muted">ยอดสุทธิ</span><h1 id="payTotal"></h1></div>
        <div class="payment-methods" role="radiogroup" aria-label="วิธีชำระเงิน">
          <label class="payment-method"><input type="radio" name="pay" value="cash" checked><span class="payment-method-icon" aria-hidden="true">💵</span><strong>เงินสด</strong></label>
          <label class="payment-method"><input type="radio" name="pay" value="transfer"><span class="payment-method-icon" aria-hidden="true">▦</span><strong>โอน / QR</strong></label>
        </div>
        <div id="cashPanel">
          <div class="field payment-field"><label for="received">รับเงิน</label><input id="received" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0"></div>
          <div id="cashShortcuts" class="cash-shortcuts"></div>
          <div class="payment-change"><span>เงินทอน</span><strong id="change" class="money-positive"></strong></div>
        </div>
        <div id="qrPanel" class="payment-qr-panel" hidden>
          <div id="paymentQr" class="payment-qr">ยังไม่ได้ตั้งค่า QR</div><b id="qrAccount"></b><span id="qrBank" class="muted"></span><p class="muted">ให้ลูกค้าสแกนและตรวจสอบยอดก่อนยืนยัน</p>
        </div>
        <button id="confirmPay" class="btn btn-primary btn-block pos-confirm-payment" type="button">ยืนยันการชำระเงิน</button>
      </div>
    </div>

    <div id="nav"></div>
  </div>
  <div class="toast" aria-live="polite"></div>
  <script type="module" src="js/pos.js"></script>
</body>
</html>
