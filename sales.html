<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#08a957">
    <title>ประวัติการขาย | ร้านของฉัน</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <header class="topbar"><a class="icon-btn" href="pos.html" style="display:grid;place-items:center">‹</a>
            <h1>ประวัติการขาย</h1><span></span>
        </header>
        <main class="page">
            <div id="salesList" class="list"></div>
        </main>
        <div id="nav"></div>
    </div>
    <div class="toast" aria-live="polite"></div>
    <script
        type="module">import { supabase, money, bottomNav, toast } from './js/config.js'; import { requireAuth } from './js/auth.js'; await requireAuth(); nav.innerHTML = bottomNav('pos'); const { data, error } = await supabase.from('sales').select('*,sale_items(id)').order('created_at', { ascending: false }).limit(100); if (error) toast(error.message); salesList.innerHTML = (data || []).map(x => `<div class="list-row"><div class="grow"><b class="receipt-no">${x.sale_no}</b><span class="muted">${new Date(x.created_at).toLocaleString('th-TH')} · ${x.sale_items.length} รายการ</span></div><b>${money(x.total)}</b></div>`).join('') || '<div class="empty card">ยังไม่มีประวัติการขาย</div>';</script>
</body>

</html>
