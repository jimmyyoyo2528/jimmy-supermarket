<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#AA432D">
  <title>เพิ่ม/แก้ไขสินค้า | Jimmy SuperMarket</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar"><a class="icon-btn" href="products.html" aria-label="กลับหน้าสินค้า">‹</a><h1 id="title">เพิ่มสินค้า</h1><span></span></header>
    <main class="page">
      <form id="form" class="card form-card">
        <div class="field">
          <label>รูปสินค้า <span class="muted">(สูงสุด 3 รูป)</span></label>
          <div id="photoGrid" class="photo-grid"></div>
          <label id="photoButton" class="btn btn-secondary btn-block">📷 ถ่ายรูป / เลือกรูป<input id="photoInput" type="file" accept="image/*" capture="environment" multiple hidden></label>
          <div class="muted photo-help">เลือกได้สูงสุด 3 รูป แต่ละรูปไม่เกิน 6 MB</div>
        </div>
        <div class="field"><label for="icon">ไอคอนสินค้า</label><input id="icon" value="📦" maxlength="4"></div>
        <div class="field"><label for="name">ชื่อสินค้า</label><input id="name" required></div>
        <div class="field"><label for="barcode">บาร์โค้ด</label><div class="barcode-row"><input id="barcode" autocomplete="off" required placeholder="กรอกหรือสแกนบาร์โค้ด"><button id="scanBarcodeButton" class="btn btn-secondary scan-btn" type="button">▥ สแกน</button></div></div>
        <div class="field"><label for="category">หมวดหมู่</label><input id="category"></div>
        <div class="two-col"><div class="field"><label for="price">ราคาขาย</label><input id="price" type="number" step="0.01" min="0" required></div><div class="field"><label for="cost">ราคาทุน</label><input id="cost" type="number" step="0.01" min="0"></div></div>
        <div class="two-col"><div class="field"><label for="stock">สต๊อกปัจจุบัน</label><input id="stock" type="number" min="0" value="0"></div><div class="field"><label for="min">แจ้งเตือนเมื่อเหลือ</label><input id="min" type="number" min="0" value="5"></div></div>
        <button id="saveButton" type="submit" class="btn btn-primary btn-block">บันทึก</button>
      </form>
    </main>
    <div id="nav"></div>
  </div>
  <div id="scannerModal" class="scanner-modal" aria-hidden="true">
    <div class="scanner-head"><span>สแกนบาร์โค้ดสินค้า</span><button id="closeScanner" class="scanner-close" type="button" aria-label="ปิด">×</button></div>
    <div class="scanner-body"><video id="scannerVideo" autoplay muted playsinline></video><div class="scanner-frame"><div class="scanner-line"></div></div></div>
    <div class="scanner-help">วางบาร์โค้ดให้อยู่กลางกรอบ แล้วถือกล้องให้นิ่ง</div>
  </div>
  <div class="toast" aria-live="polite"></div>
  <script src="https://unpkg.com/@zxing/browser@latest"></script>
  <script type="module" src="js/product-form.js"></script>
</body>
</html>
