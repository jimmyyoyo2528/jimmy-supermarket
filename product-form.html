<!doctype html>
<html lang="th">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
    <meta name="theme-color" content="#08a957">
    <title>เพิ่ม/แก้ไขสินค้า | ร้านของฉัน</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">
        <header class="topbar"><a class="icon-btn" href="products.html" style="display:grid;place-items:center">‹</a>
            <h1 id="title">เพิ่มสินค้า</h1><span></span>
        </header>
        <main class="page">
            <form id="form" class="card" style="padding:16px">
                <div class="field"><label>รูปสินค้า</label>
                    <div id="photoPreview"
                        style="width:140px;height:140px;margin:0 auto 12px;border:1px solid #e6eaf0;border-radius:18px;display:grid;place-items:center;overflow:hidden;background:#f7fafc;font-size:42px">
                        📦</div><label class="btn btn-secondary btn-block" style="display:block;text-align:center">📷
                        ถ่ายรูป / เลือกรูป<input id="photoInput" type="file" accept="image/*" capture="environment"
                            hidden></label>
                    <div class="muted" style="text-align:center;margin-top:7px">หลังถ่าย ระบบจะพยายามอ่าน QR / Barcode
                        จากรูปอัตโนมัติ</div>
                </div>
                <div class="field"><label>ไอคอนสินค้า</label><input id="icon" value="📦" maxlength="4"></div>
                <div class="field"><label>ชื่อสินค้า</label><input id="name" required></div>
                <div class="field"><label>บาร์โค้ด</label><input id="barcode" inputmode="numeric" required></div>
                <div class="field"><label>หมวดหมู่</label><input id="category"></div>
                <div class="two-col">
                    <div class="field"><label>ราคาขาย</label><input id="price" type="number" step="0.01" min="0"
                            required></div>
                    <div class="field"><label>ราคาทุน</label><input id="cost" type="number" step="0.01" min="0"></div>
                </div>
                <div class="two-col">
                    <div class="field"><label>สต๊อกปัจจุบัน</label><input id="stock" type="number" min="0" value="0">
                    </div>
                    <div class="field"><label>แจ้งเตือนเมื่อเหลือ</label><input id="min" type="number" min="0"
                            value="5"></div>
                </div><button class="btn btn-primary btn-block">บันทึก</button>
            </form>
        </main>
        <div id="nav"></div>
    </div>
    <div class="toast" aria-live="polite"></div>
    <script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
    <script
        type="module">import { supabase, toast, bottomNav } from './js/config.js'; import { requireAuth } from './js/auth.js'; await requireAuth(); nav.innerHTML = bottomNav('stock'); const q = new URLSearchParams(location.search), id = q.get('id'); let p = null; if (id) { const r = await supabase.from('products').select('*').eq('id', id).single(); p = r.data; if (p) { title.textContent = 'แก้ไขสินค้า'; icon.value = p.icon || '📦'; name.value = p.name; barcode.value = p.barcode; category.value = p.category || ''; price.value = p.price; cost.value = p.cost; stock.value = p.stock; min.value = p.min_stock } } else barcode.value = q.get('barcode') || '';
            let selectedPhoto = null;
            const photoInput = document.querySelector('#photoInput'), photoPreview = document.querySelector('#photoPreview');
            async function findBarcode(code) { code = (code || '').trim(); if (!code) return; barcode.value = code; const { data, error } = await supabase.from('products').select('*').eq('barcode', code).maybeSingle(); if (error) return toast(error.message); if (data) { p = data; title.textContent = 'แก้ไขสินค้า'; icon.value = data.icon || '📦'; name.value = data.name || ''; category.value = data.category || ''; price.value = data.price ?? ''; cost.value = data.cost ?? ''; stock.value = data.stock ?? 0; min.value = data.min_stock ?? 5; if (data.image_url) photoPreview.innerHTML = `<img src="${data.image_url}" alt="สินค้า" style="width:100%;height:100%;object-fit:cover">`; toast('พบสินค้าเดิม โหลดข้อมูลแล้ว') } else toast('อ่านบาร์โค้ดได้: ' + code) }
            async function decodePhoto(file) { if (!window.ZXing) { toast('โหลดตัวอ่าน Barcode ไม่สำเร็จ'); return } const url = URL.createObjectURL(file); try { const reader = new ZXing.BrowserMultiFormatReader(); const result = await reader.decodeFromImageUrl(url); await findBarcode(result.getText()); } catch (err) { toast('เก็บรูปแล้ว แต่ยังอ่าน Barcode ไม่ได้ กรุณาถ่ายให้ตรงและชัดขึ้น') } finally { setTimeout(() => URL.revokeObjectURL(url), 1500) } }
            photoInput?.addEventListener('change', async e => { const file = e.target.files?.[0]; if (!file) return; if (!file.type.startsWith('image/')) return toast('กรุณาเลือกรูปภาพ'); if (file.size > 6 * 1024 * 1024) return toast('รูปต้องไม่เกิน 6 MB'); selectedPhoto = file; const url = URL.createObjectURL(file); photoPreview.innerHTML = `<img src="${url}" alt="ตัวอย่างสินค้า" style="width:100%;height:100%;object-fit:cover">`; await decodePhoto(file) });
            async function uploadPhoto() { if (!selectedPhoto) return p?.image_url || null; const ext = (selectedPhoto.name.split('.').pop() || 'jpg').replace(/[^a-z0-9]/gi, '').toLowerCase(); const path = `products/${crypto.randomUUID()}.${ext}`; const { error } = await supabase.storage.from('product-images').upload(path, selectedPhoto, { contentType: selectedPhoto.type, upsert: false }); if (error) throw error; return supabase.storage.from('product-images').getPublicUrl(path).data.publicUrl }
            form.onsubmit = async e => { e.preventDefault(); try { const image_url = await uploadPhoto(); const data = { icon: String(document.querySelector('#icon')?.value || '📦'), image_url, name: String(document.querySelector('#name')?.value || '').trim(), barcode: String(document.querySelector('#barcode')?.value || '').trim(), category: String(document.querySelector('#category')?.value || '').trim(), price: Number(document.querySelector('#price')?.value || 0), cost: Number(document.querySelector('#cost')?.value || 0), stock: Number(document.querySelector('#stock')?.value || 0), min_stock: Number(document.querySelector('#min')?.value || 0), active: true }; if (!data.name) throw new Error('กรุณากรอกชื่อสินค้า'); if (!data.barcode) throw new Error('กรุณากรอกบาร์โค้ด'); const r = p ? await supabase.from('products').update(data).eq('id', p.id) : await supabase.from('products').insert(data); if (r.error) throw r.error; toast('บันทึกสำเร็จ'); setTimeout(() => location.href = 'products.html', 600) } catch (err) { toast(err.message || 'บันทึกไม่สำเร็จ') } }</script>
</body>

</html>
