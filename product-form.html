<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#08a957"><title>เพิ่ม/แก้ไขสินค้า | ร้านของฉัน</title><link rel="stylesheet" href="css/style.css"></head><body><div class="app"><header class="topbar"><a class="icon-btn" href="products.html" style="display:grid;place-items:center">‹</a><h1 id="title">เพิ่มสินค้า</h1><span></span></header><main class="page"><form id="form" class="card" style="padding:16px"><div class="field"><label>รูป/ไอคอนสินค้า</label><input id="icon" value="📦" maxlength="4"></div><div class="field"><label>ชื่อสินค้า</label><input id="name" required></div><div class="field"><label>บาร์โค้ด</label><input id="barcode" inputmode="numeric" required></div><div class="field"><label>หมวดหมู่</label><input id="category"></div><div class="two-col"><div class="field"><label>ราคาขาย</label><input id="price" type="number" step="0.01" min="0" required></div><div class="field"><label>ราคาทุน</label><input id="cost" type="number" step="0.01" min="0"></div></div><div class="two-col"><div class="field"><label>สต๊อกปัจจุบัน</label><input id="stock" type="number" min="0" value="0"></div><div class="field"><label>แจ้งเตือนเมื่อเหลือ</label><input id="min" type="number" min="0" value="5"></div></div><button class="btn btn-primary btn-block">บันทึก</button></form></main><div id="nav"></div></div><div class="toast" aria-live="polite"></div><script type="module">import{DB,toast,bottomNav}from'./js/config.js';import{requireAuth}from'./js/auth.js';requireAuth();document.querySelector('#nav').innerHTML=bottomNav('stock');let ps=DB.get('products'),q=new URLSearchParams(location.search),id=q.get('id'),p=ps.find(x=>x.id===id);if(p){title.textContent='แก้ไขสินค้า';['icon','name','barcode','category','price','cost','stock','min'].forEach(k=>document.querySelector('#'+k).value=p[k]??'')}else barcode.value=q.get('barcode')||'';form.onsubmit=e=>{e.preventDefault();const data={id:p?.id||crypto.randomUUID(),icon:icon.value||'📦',name:name.value.trim(),barcode:barcode.value.trim(),category:category.value.trim(),price:+price.value||0,cost:+cost.value||0,stock:+stock.value||0,min:+min.value||0,active:true};if(ps.some(x=>x.barcode===data.barcode&&x.id!==data.id))return toast('บาร์โค้ดนี้มีอยู่แล้ว');p?ps=ps.map(x=>x.id===p.id?data:x):ps.push(data);DB.set('products',ps);toast('บันทึกสำเร็จ');setTimeout(()=>location.href='products.html',600)}</script></body></html>
